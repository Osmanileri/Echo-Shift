name: Build and Deploy iOS (TestFlight)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Fastlane & Dependencies
        run: |
          gem install bundler
          bundle update fastlane
          bundle install

      - name: Decode Certificate and Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Decoding certificate..."
            echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > android_fastlane_certificate.p12
            echo "Certificate decoded to android_fastlane_certificate.p12"
          else
            echo "No BUILD_CERTIFICATE_BASE64 secret found."
          fi

          if [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "Decoding provisioning profile..."
            echo $PROVISIONING_PROFILE_BASE64 | base64 --decode > android_fastlane_profile.mobileprovision
            echo "Profile decoded to android_fastlane_profile.mobileprovision"
          else
             echo "No PROVISIONING_PROFILE_BASE64 secret found."
          fi

      - name: Deploy to TestFlight
        run: bundle exec fastlane deploy
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          FASTLANE_APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
